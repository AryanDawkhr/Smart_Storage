# Render Blueprint for the FastAPI backend.
# Deploy via Render Dashboard: New > Blueprint > select this repo.
services:
  - type: web
    name: smart-storage-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false