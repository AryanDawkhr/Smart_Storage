<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan Storage QR - Smart Storage</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lightweight QR scanner library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="home.html" style="text-decoration: none; color: var(--text-main); font-size: 20px;">
        ←
      </a>
      <div class="brand-title">Identify Storage Unit</div>
      <div style="width: 24px;"></div>
    </header>

    <main class="app-content">
      <div class="card" style="text-align: center;">
        <h2 style="font-size: 1.15rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 6px;">
          Scan Physical Unit QR Code
        </h2>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px;">
          Point your camera at the QR code affixed to the physical cold chamber.
        </p>

        <!-- Camera Viewfinder Box -->
        <div id="qr-reader" style="width: 100%; max-width: 320px; margin: 0 auto 16px auto; border-radius: 12px; overflow: hidden; background: #263238; min-height: 240px; display: flex; align-items: center; justify-content: center; color: #fff;">
          <div id="cameraStatusText" style="padding: 20px;">
            <div>📷 Camera Scanner Ready</div>
            <button class="btn btn-primary" onclick="startCameraScanner()" style="margin-top: 12px; font-size: 0.85rem; height: 40px;">
              Start Camera Scan
            </button>
          </div>
        </div>

        <div id="scanResultBadge" style="display: none; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; margin-bottom: 14px;"></div>

        <!-- Manual Unit Code Entry Fallback -->
        <div style="border-top: 1px solid var(--border-color); pt: 16px; margin-top: 16px;">
          <div style="font-size: 0.82rem; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase;">
            Or Enter Unit ID Manually
          </div>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="manualUnitInput" class="form-input" placeholder="e.g. NER-CS-001" style="text-transform: uppercase;">
            <button class="btn btn-primary" onclick="handleManualLookup()" style="width: auto; padding: 0 16px;">
              Go
            </button>
          </div>
        </div>
      </div>

      <!-- Quick Demo Units Selector -->
      <div class="card">
        <div class="card-header" style="margin-bottom: 10px;">
          <div class="card-title" style="font-size: 0.95rem;">
            <span>📍</span> Regional Decentralized Units
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <button class="btn btn-secondary" onclick="selectUnitCode('NER-CS-001', 1)" style="justify-content: space-between; height: 50px;">
            <span style="font-weight: 700;">NER-CS-001 (Mayong, Morigaon)</span>
            <span style="font-size: 0.78rem; color: var(--primary);">50 kg (Assam)</span>
          </button>
          <button class="btn btn-secondary" onclick="selectUnitCode('NER-CS-002', 2)" style="justify-content: space-between; height: 50px;">
            <span style="font-weight: 700;">NER-CS-002 (Teok, Jorhat)</span>
            <span style="font-size: 0.78rem; color: var(--primary);">50 kg (Assam)</span>
          </button>
          <button class="btn btn-secondary" onclick="selectUnitCode('NER-CS-003', 3)" style="justify-content: space-between; height: 50px;">
            <span style="font-weight: 700;">NER-CS-003 (Mawkynrew, Shillong)</span>
            <span style="font-size: 0.78rem; color: var(--primary);">75 kg (Meghalaya)</span>
          </button>
        </div>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="home.html" class="nav-item">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </a>
      <a href="storage.html" class="nav-item">
        <span class="nav-icon">❄️</span>
        <span>Storage</span>
      </a>
      <div class="nav-fab-wrap">
        <a href="add-produce.html" class="nav-fab">➕</a>
      </div>
      <a href="alerts.html" class="nav-item">
        <span class="nav-icon">🔔</span>
        <span>Alerts</span>
      </a>
      <a href="history.html" class="nav-item">
        <span class="nav-icon">📜</span>
        <span>History</span>
      </a>
    </nav>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    let html5QrCode = null;

    function startCameraScanner() {
      const statusText = document.getElementById('cameraStatusText');
      if (typeof Html5Qrcode === 'undefined') {
        if (statusText) statusText.innerHTML = "Camera scanning requires HTTPS. Use manual entry below.";
        return;
      }

      html5QrCode = new Html5Qrcode("qr-reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        (decodedText) => {
          html5QrCode.stop().then(() => {
            selectUnitCode(decodedText);
          });
        },
        (errorMessage) => {
          // ignore scan frame errors
        }
      ).catch(err => {
        if (statusText) statusText.innerHTML = "Camera permission not granted. Use manual entry below.";
      });
    }

    async function handleManualLookup() {
      const code = document.getElementById('manualUnitInput').value.trim().toUpperCase();
      if (!code) {
        app.showToast('Please enter a Unit ID', 'warning');
        return;
      }
      selectUnitCode(code);
    }

    async function selectUnitCode(code, unitId = null) {
      try {
        const unit = await window.api.getStorageUnitByQR(code);
        app.setActiveUnit(unit.unit_code, unit.id);
        app.showToast(`Identified Storage Unit: ${unit.unit_code}`, 'success');
        setTimeout(() => window.location.href = 'storage.html', 700);
      } catch (e) {
        // If unit not in DB, fallback gracefully
        app.setActiveUnit(code, unitId || 1);
        app.showToast(`Selected Unit ${code}`, 'success');
        setTimeout(() => window.location.href = 'storage.html', 700);
      }
    }
  </script>
</body>
</html>
