<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer Registration - Smart Storage</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container" style="padding: 16px;">
    <div id="offlineBanner" class="offline-banner">
      <span>⚠️ Offline Mode Active (Registration will sync when online)</span>
    </div>

    <div class="card" style="margin-top: 10px; margin-bottom: 20px;">
      <div style="text-align: center; margin-bottom: 20px;">
        <h1 style="font-size: 1.4rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 4px;">
          Farmer Registration
        </h1>
        <p style="font-size: 0.88rem; color: var(--text-muted);">
          Join your local decentralized solar cold storage network
        </p>
      </div>

      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label" for="regName">Farmer Full Name</label>
          <input type="text" id="regName" class="form-input" placeholder="e.g. Ramesh Bora" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="regMobile">Mobile Number</label>
          <input type="tel" id="regMobile" class="form-input" placeholder="10-digit mobile number" required pattern="[0-9]{10}">
        </div>

        <div class="form-group">
          <label class="form-label" for="regState">State (NER Focus)</label>
          <select id="regState" class="form-select" required>
            <option value="Assam">Assam</option>
            <option value="Arunachal Pradesh">Arunachal Pradesh</option>
            <option value="Manipur">Manipur</option>
            <option value="Meghalaya">Meghalaya</option>
            <option value="Mizoram">Mizoram</option>
            <option value="Nagaland">Nagaland</option>
            <option value="Sikkim">Sikkim</option>
            <option value="Tripura">Tripura</option>
            <option value="Other">Other Region</option>
          </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-group">
            <label class="form-label" for="regDistrict">District</label>
            <input type="text" id="regDistrict" class="form-input" placeholder="e.g. Morigaon" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="regVillage">Village</label>
            <input type="text" id="regVillage" class="form-input" placeholder="e.g. Mayong" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Create Password</label>
          <input type="password" id="regPassword" class="form-input" placeholder="Min. 6 characters" required minlength="6">
        </div>

        <div class="form-group">
          <label class="form-label" for="regConfirmPassword">Confirm Password</label>
          <input type="password" id="regConfirmPassword" class="form-input" placeholder="Confirm password" required minlength="6">
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 8px;">
          Complete Registration
        </button>
      </form>

      <div style="text-align: center; margin-top: 16px; font-size: 0.9rem;">
        <span style="color: var(--text-muted);">Already registered?</span>
        <a href="index.html" style="color: var(--primary); font-weight: 700; text-decoration: none; margin-left: 6px;">
          Login
        </a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const mobile = document.getElementById('regMobile').value.trim();
      const state = document.getElementById('regState').value;
      const district = document.getElementById('regDistrict').value.trim();
      const village = document.getElementById('regVillage').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirmPassword').value;

      if (password !== confirm) {
        app.showToast('Passwords do not match.', 'error');
        return;
      }

      try {
        await auth.register({ name, mobile, state, district, village, password });
        app.showToast('Registration successful! Welcome to Smart Storage.', 'success');
        setTimeout(() => window.location.href = 'home.html', 800);
      } catch (err) {
        app.showToast(err.message || 'Registration failed', 'error');
      }
    }
  </script>
</body>
</html>
