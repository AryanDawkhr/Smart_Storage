<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storage History & Age - Smart Storage</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="home.html" style="text-decoration: none; color: var(--text-main); font-size: 20px;">
        ←
      </a>
      <div class="brand-title">Storage History & Aging</div>
      <div style="width: 24px;"></div>
    </header>

    <main class="app-content">
      <!-- Filter Tabs -->
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <button id="tabMyProduce" class="btn btn-primary" style="height: 38px; font-size: 0.85rem;" onclick="setHistoryFilter(false)">
          My Stored Produce
        </button>
        <button id="tabAllChamber" class="btn btn-secondary" style="height: 38px; font-size: 0.85rem;" onclick="setHistoryFilter(true)">
          Entire Chamber History
        </button>
      </div>

      <div id="historyListContainer">
        <!-- Populated by history.js -->
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="home.html" class="nav-item">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </a>
      <a href="storage.html" class="nav-item">
        <span class="nav-icon">❄️</span>
        <span>Storage</span>
      </a>
      <div class="nav-fab-wrap">
        <a href="add-produce.html" class="nav-fab">➕</a>
      </div>
      <a href="alerts.html" class="nav-item">
        <span class="nav-icon">🔔</span>
        <span>Alerts</span>
      </a>
      <a href="history.html" class="nav-item active">
        <span class="nav-icon">📜</span>
        <span>History</span>
      </a>
    </nav>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/history.js"></script>
  <script>
    function setHistoryFilter(allFarmers) {
      document.getElementById('tabMyProduce').className = !allFarmers ? 'btn btn-primary' : 'btn btn-secondary';
      document.getElementById('tabAllChamber').className = allFarmers ? 'btn btn-primary' : 'btn btn-secondary';
      historyPage.loadHistory(allFarmers);
    }
    document.addEventListener('DOMContentLoaded', () => setHistoryFilter(false));
  </script>
</body>
</html>
