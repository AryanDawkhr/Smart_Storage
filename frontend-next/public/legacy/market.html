<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market & Transport - Smart Storage</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="home.html" style="text-decoration: none; color: var(--text-main); font-size: 20px;">
        ←
      </a>
      <div class="brand-title">Market & Logistics</div>
      <a href="recommendation.html" title="View Decision Support" style="font-size: 20px; text-decoration: none;">💡</a>
    </header>

    <main class="app-content">
      <!-- Section 1: Regional Mandi Rates -->
      <section>
        <div class="card-header" style="margin-bottom: 8px;">
          <div class="card-title" style="font-size: 1.05rem;">
            <span>🌾</span> Regional Mandi & APMC Rates
          </div>
          <span style="font-size: 0.78rem; color: var(--text-muted);">NER Live Mandis</span>
        </div>
        <div id="marketPricesContainer">
          <!-- Populated by market.js -->
        </div>
      </section>

      <!-- Section 2: Rural Transport & Freight Options -->
      <section style="margin-top: 10px;">
        <div class="card-header" style="margin-bottom: 8px;">
          <div class="card-title" style="font-size: 1.05rem;">
            <span>🚚</span> Scheduled Rural Freight & Pickup
          </div>
          <span style="font-size: 0.78rem; color: var(--text-muted);">Village Links</span>
        </div>
        <div id="transportOptionsContainer">
          <!-- Populated by market.js -->
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="home.html" class="nav-item">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </a>
      <a href="storage.html" class="nav-item">
        <span class="nav-icon">❄️</span>
        <span>Storage</span>
      </a>
      <div class="nav-fab-wrap">
        <a href="add-produce.html" class="nav-fab">➕</a>
      </div>
      <a href="alerts.html" class="nav-item">
        <span class="nav-icon">🔔</span>
        <span>Alerts</span>
      </a>
      <a href="history.html" class="nav-item">
        <span class="nav-icon">📜</span>
        <span>History</span>
      </a>
    </nav>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/market.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => marketPage.init());
  </script>
</body>
</html>
